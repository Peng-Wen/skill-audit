name: evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scanner-lane:
    # The deterministic lane is the gate: no model, no network, same answer
    # every run. The live lane needs credentials and costs money, so it is run
    # deliberately rather than on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check repository invariants
        run: python3 evals/check_invariants.py

      - name: Validate against the Agent Skills specification
        run: npx -y skills-ref@latest validate ./skill-audit

      # The authority on what leaves this repository. Everything else about
      # the internal flag is read out of YAML by hand, and eight rounds of
      # review showed that approximation keeps missing a spelling, in both
      # directions: a skill that should stay unpublished slipping out, and the
      # shipped skill being hidden so the install carries nothing. Asking the
      # installer removes the guesswork. The version is pinned so an upstream
      # release cannot fail an unrelated pull request; bump it deliberately to
      # re-verify against a newer installer.
      - name: Check the published install carries only the shipped skill
        run: |
          set -euo pipefail
          for flags in "" "--full-depth"; do
            mode="${flags:-default}"
            out=$(npx -y skills@1.5.24 add . --list $flags 2>&1)
            names=$(printf '%s' "$out" \
              | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' \
              | grep -oE '\xe2\x94\x82 +[A-Za-z0-9][A-Za-z0-9_-]*$' \
              | sed 's/[^A-Za-z0-9_-]//g' | sort -u | paste -sd, -)
            echo "$mode -> [$names]"
            if [ "$names" != "skill-audit" ]; then
              echo "$out"
              echo "Expected the installer to publish only skill-audit, got [$names]."
              exit 1
            fi
          done

      - name: Run the deterministic eval lane
        run: python3 evals/run_evals.py --lane scanner-only --ci

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
